name: flutter_pelita_user
description: "Aplikasi Mobile PELITA"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  google_fonts: ^9.0.0

  shared_preferences: ^2.5.6

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/avatar_siti.png
    - assets/images/avatar_raka.png
    - assets/images/avatar_sari.png
    - assets/images/logo_pelita.png
    - assets/images/icon_balita.png
    - assets/images/icon_ibu_hamil.png
    - assets/images/icon_lansia.png
    - assets/images/icon_booking.png
    - assets/images/icon_antrean.png
    - assets/images/icon_riwayat.png